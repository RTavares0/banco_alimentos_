<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rio Grande Solidária v5.0 - Modern UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981; /* Verde Esmeralda moderno */
            --primary-dark: #059669;
            --secondary: #1e293b; /* Azul ardósia escuro */
            --urgent: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 50px;
        }

        /* Header Modernizado */
        header {
            background: linear-gradient(135deg, var(--secondary) 0%, #334155 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 { margin: 0; font-size: 2.5rem; letter-spacing: -1px; }
        header p { opacity: 0.9; font-weight: 300; margin-top: 10px; }

        .container {
            width: 95%;
            max-width: 1000px;
            margin: -30px auto 0; /* Efeito de sobreposição no header */
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--secondary);
            margin-bottom: 25px;
            font-weight: 700;
        }

        /* Grid do Formulário */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); }

        input, select {
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
            background: #f1f5f9;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .btn-add {
            grid-column: 1 / -1;
            background: var(--primary);
            color: white;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-add:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3); }

        /* Filtros e Busca */
        .list-header {
            margin-top: 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        /* Estilo dos Cards (Feed) */
        #listaItens {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .item-card {
            background: white;
            border: 1px solid #f1f5f9;
            border-radius: 16px;
            padding: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .item-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }

        .urgent-card { border: 2px solid #fee2e2; background: #fffafb; }
        .urgent-badge { 
            background: #fee2e2; color: #ef4444; padding: 4px 12px; 
            border-radius: 99px; font-size: 0.75rem; font-weight: 800;
            display: inline-block; margin-bottom: 12px;
        }

        .doador-info { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; font-weight: 700; }
        .item-name { font-size: 1.25rem; font-weight: 700; margin-bottom: 16px; color: var(--secondary); }
        .detail-row { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #475569; margin-bottom: 6px; }

        .btn-collect {
            margin-top: auto;
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-collect:hover { background: #0f172a; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px; color: var(--text-muted); }
    </style>
</head>
<body>

<header>
    <h1>Rio Grande Solidária</h1>
    <p>Conectando excedentes alimentares a quem mais precisa.</p>
</header>

<div class="container">
    <div class="section-title">✨ Publicar Disponibilidade</div>
    <div class="form-grid">
        <div class="input-group full-width" style="grid-column: 1 / -1;">
            <label>Estabelecimento Doador</label>
            <input type="text" id="doador" placeholder="Ex: Panificadora Central ou Supermercado Guanabara">
        </div>
        <div class="input-group">
            <label>O que você vai doar?</label>
            <input type="text" id="alimento" placeholder="Ex: 20 pães franceses">
        </div>
        <div class="input-group">
            <label>Data de Validade</label>
            <input type="date" id="validade">
        </div>
        <div class="input-group">
            <label>Bairro de Retirada</label>
            <select id="bairro">
                <option value="Centro">Centro</option>
                <option value="Cassino">Cassino</option>
                <option value="Pq. Marinha">Parque Marinha</option>
                <option value="Cidade Nova">Cidade Nova</option>
            </select>
        </div>
        <button class="btn-add" onclick="adicionarDoacao()">Publicar na Rede</button>
    </div>

    <div class="list-header">
        <div class="section-title" style="margin-bottom: 0;">📦 Itens Disponíveis</div>
        <input type="text" id="filtroBairro" placeholder="🔍 Buscar por bairro..." style="width: 250px;" onkeyup="filtrarItens()">
    </div>

    <div id="listaItens">
        </div>
</div>

<script>
    let doacoes = JSON.parse(localStorage.getItem('uninter_extensionista_ads')) || [];
    renderizarLista();

    function adicionarDoacao() {
        const doador = document.getElementById('doador').value;
        const alimento = document.getElementById('alimento').value;
        const validade = document.getElementById('validade').value;
        const bairro = document.getElementById('bairro').value;
        const hoje = new Date().toISOString().split('T')[0];

        if (!doador || !alimento || !validade) {
            alert("Por favor, preencha todos os campos.");
            return;
        }

        if (validade < hoje) {
            alert("Data de validade inválida.");
            return;
        }

        const novaDoacao = {
            id: Date.now(),
            doador,
            alimento,
            validade,
            bairro,
            urgente: verificarUrgencia(validade)
        };

        doacoes.unshift(novaDoacao);
        salvar();
        document.querySelectorAll('input').forEach(i => i.value = "");
    }

    function verificarUrgencia(dataValidade) {
        const diff = Math.ceil((new Date(dataValidade) - new Date()) / (1000 * 60 * 60 * 24));
        return diff <= 1;
    }

    function solicitarColeta(id) {
        if (confirm("Confirmar interesse nesta coleta?")) {
            doacoes = doacoes.filter(d => d.id !== id);
            salvar();
        }
    }

    function filtrarItens() {
        const busca = document.getElementById('filtroBairro').value.toLowerCase();
        document.querySelectorAll('.item-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(busca) ? "flex" : "none";
        });
    }

    function salvar() {
        localStorage.setItem('uninter_extensionista_ads', JSON.stringify(doacoes));
        renderizarLista();
    }

    function renderizarLista() {
        const lista = document.getElementById('listaItens');
        if (doacoes.length === 0) {
            lista.innerHTML = '<div class="empty-state">Sem doações no momento em Rio Grande.</div>';
            return;
        }
        
        lista.innerHTML = '';
        doacoes.forEach(d => {
            const card = document.createElement('div');
            card.className = `item-card ${d.urgente ? 'urgent-card' : ''}`;
            card.innerHTML = `
                ${d.urgente ? '<span class="urgent-badge">⏱ RETIRADA IMEDIATA</span>' : ''}
                <div class="doador-info">🏢 ${d.doador}</div>
                <div class="item-name">${d.alimento}</div>
                <div class="detail-row">📍 <span>Bairro ${d.bairro}</span></div>
                <div class="detail-row">📅 <span>Validade: ${d.validade.split('-').reverse().join('/')}</span></div>
                <button class="btn-collect" onclick="solicitarColeta(${d.id})">Reservar para Minha ONG</button>
            `;
            lista.appendChild(card);
        });
    }
</script>
</body>
</html>
